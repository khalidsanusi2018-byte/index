<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codebloom Pro</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-image: url("codecodecode.jpeg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: 'Nunito', sans-serif;
        }

        .page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 65px 20px 40px;
        }

        .logo {
            width: 150px;
            height: auto;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .hero {
            width: 100%;
            max-width: 470px;
            padding: 30px 35px 85px;
            background-color: rgba(255, 20, 110, 0.55);
            border-radius: 10px;

            display: flex;
            flex-direction: column;
        }

        .hero h3 {
            text-align: center;
            color: white;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 15px;
        }

        .hero hr {
            border: none;
            border-top: 2px solid white;
            margin-bottom: 55px;
        }

        .hero label {
            color: white;
            font-size: 23px;
            margin-bottom: 12px;
        }

        .hero input {
            width: 100%;
            padding: 12px;
            font-size: 19px;
            border: none;
            outline: none;
            background-color: white;
            margin-bottom: 40px;
        }

        .forgot {
            text-align: right;
            margin-top: -18px;
            margin-bottom: 25px;
        }

        .forgot a {
            color: black;
            text-decoration: none;
            font-size: 18px;
        }

        .hero button {
            width: 100%;
            padding: 15px;
            background-color: black;
            color: white;
            border: none;
            font-size: 20px;
            font-weight: 800;
            cursor: pointer;
        }

       
    
    </style>
</head>

<body>

    <section class="page">

        <img src="codebloom.jpeg" alt="Codebloom Logo" class="logo">

        <div class="hero">

            <h3>STUDENT LOGIN</h3>

            <hr>

            <label for="number">Identity Number:</label>

            <input type="text"
                   id="number"
                   name="number"
                   placeholder="Student/Applicant">

            <label for="psw">Password:</label>

            <input type="password"
                   id="psw"
                   name="password"
                   placeholder="Password">

            <p class="forgot">
                <a href="#">Forget Password?</a>
            </p>

            <button type="submit">Login</button>

        </div>

    </section>

</body>
</html>
